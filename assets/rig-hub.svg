<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="60" fill="url(#bg)"/>
  <rect x="8" y="8" width="240" height="240" rx="60" fill="url(#glow)"/>
  <!-- spokes -->
  <g stroke="#ffffff" stroke-width="12" stroke-linecap="round" opacity="0.9">
    <line x1="128" y1="128" x2="128" y2="62"/>
    <line x1="128" y1="128" x2="71" y2="161"/>
    <line x1="128" y1="128" x2="185" y2="161"/>
  </g>
  <!-- satellites: mouse, headset, cooler -->
  <g fill="#ffffff">
    <rect x="113" y="34" width="30" height="42" rx="15"/>
    <circle cx="62" cy="168" r="20"/>
    <circle cx="194" cy="168" r="20"/>
  </g>
  <rect x="126" y="40" width="4" height="12" rx="2" fill="#7C3AED"/>
  <circle cx="62" cy="168" r="8" fill="#6D28D9"/>
  <g fill="none" stroke="#0891B2" stroke-width="4">
    <circle cx="194" cy="168" r="9"/>
  </g>
  <!-- hub -->
  <circle cx="128" cy="128" r="30" fill="#ffffff"/>
  <circle cx="128" cy="128" r="16" fill="url(#bg)"/>
</svg>
